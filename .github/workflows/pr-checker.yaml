name: PR Checker

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'applications/**'
      - 'charts/**'
      - 'Makefile'
      - '*.md'
      - '.yamllint.yaml'
      - '.github/workflows/pr-checker.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'applications/**'
      - 'charts/**'
      - 'Makefile'
      - '*.md'
      - '.yamllint.yaml'
      - '.github/workflows/pr-checker.yaml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Validate YAML files with yq
        run: |
          for f in $(find infrastructure applications charts -type f \( -name "*.yaml" -o -name "*.yml" \) -not -path "*/templates/*"); do
            yq 'true' "$f" > /dev/null || (echo "ERROR: Invalid YAML syntax in $f" && exit 1)
          done
          echo "All non-template YAML manifests passed syntax validation."

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Charts
        run: |
          for chart in $(find infrastructure applications charts -type f -name "Chart.yaml" -exec dirname {} \;); do
            echo "Linting Helm chart at $chart..."
            helm lint "$chart" --set image.tag=ci || exit 1
          done
          echo "All Helm charts passed linting."

      - name: Render Helm Charts
        run: |
          for chart in $(find infrastructure applications charts -type f -name "Chart.yaml" -exec dirname {} \;); do
            name=$(basename "$chart")
            echo "Rendering Helm chart $name at $chart..."
            helm template "$name" "$chart" --set image.tag=ci >/dev/null || exit 1
          done
          echo "All Helm charts rendered."

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.8.0
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Schema-validate rendered charts
        run: |
          for chart in $(find infrastructure applications charts -type f -name "Chart.yaml" -exec dirname {} \;); do
            name=$(basename "$chart")
            echo "kubeconform $chart..."
            helm template "$name" "$chart" --set image.tag=ci \
              | kubeconform -strict -summary -ignore-missing-schemas || exit 1
          done
          echo "All rendered charts passed kubeconform."

      - name: Install helm-unittest
        run: |
          # Helm 4 requires --verify=false for git plugin installs (no GPG webhook).
          if helm version --short | grep -q '^v4'; then
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2 --verify=false
          else
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2
          fi

      - name: Unit test Helm Charts
        run: |
          charts=$(find charts -type f -name Chart.yaml -exec dirname {} \;)
          if [ -z "$charts" ]; then
            echo "No charts under charts/; skipping helm unittest"
          else
            helm unittest $charts
          fi

      - name: Verify PostgreSQL Connection Limits
        run: |
          MAX_CONNS=$(yq '.spec.postgresql.parameters.max_connections' infrastructure/platform-postgresql/cluster.yaml)
          echo "PostgreSQL max_connections: $MAX_CONNS"

          RESERVED_CONNS=15
          SERVICE_LIMIT=$((MAX_CONNS - RESERVED_CONNS))
          echo "Service connection budget: $SERVICE_LIMIT (reserving $RESERVED_CONNS for CNPG system operations)"

          TOTAL_LIMIT=$(grep "connectionLimit:" infrastructure/platform-postgresql/database-role.yaml | awk '{sum += $2} END {print sum}')
          echo "Total DatabaseRole connectionLimit sum: $TOTAL_LIMIT"

          if [ "$TOTAL_LIMIT" -gt "$SERVICE_LIMIT" ]; then
            echo "ERROR: Total connectionLimit ($TOTAL_LIMIT) exceeds the service budget ($SERVICE_LIMIT), which reserves $RESERVED_CONNS connections for CNPG operations!"
            exit 1
          fi
          echo "OK: Connection limit total ($TOTAL_LIMIT) is within service budget ($SERVICE_LIMIT)."
