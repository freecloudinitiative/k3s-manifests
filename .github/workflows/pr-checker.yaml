name: PR Checker

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'applications/**'
      - 'Makefile'
      - '*.md'
      - '.yamllint.yaml'
      - '.github/workflows/pr-checker.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'applications/**'
      - 'Makefile'
      - '*.md'
      - '.yamllint.yaml'
      - '.github/workflows/pr-checker.yaml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Validate YAML files with yq
        run: |
          for f in $(find infrastructure applications -type f \( -name "*.yaml" -o -name "*.yml" \) -not -path "*/templates/*"); do
            yq 'true' "$f" > /dev/null || (echo "ERROR: Invalid YAML syntax in $f" && exit 1)
          done
          echo "All non-template YAML manifests passed syntax validation."

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Charts
        run: |
          for chart in $(find infrastructure applications -type f -name "Chart.yaml" -exec dirname {} \;); do
            echo "Linting Helm chart at $chart..."
            helm lint "$chart" --set image.tag=ci || exit 1
          done
          echo "All Helm charts passed linting."

      - name: Render Helm Charts
        run: |
          for chart in $(find infrastructure applications -type f -name "Chart.yaml" -exec dirname {} \;); do
            name=$(basename "$chart")
            echo "Rendering Helm chart $name at $chart..."
            helm template "$name" "$chart" --set image.tag=ci >/dev/null || exit 1
          done
          echo "All Helm charts rendered."

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.8.0
          KUBECONFORM_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar xz -C "$HOME/bin" -f /tmp/kubeconform.tar.gz kubeconform
          rm /tmp/kubeconform.tar.gz
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Schema-validate rendered charts
        run: |
          for chart in $(find infrastructure applications -type f -name "Chart.yaml" -exec dirname {} \;); do
            name=$(basename "$chart")
            echo "kubeconform $chart..."
            helm template "$name" "$chart" --set image.tag=ci \
              | kubeconform -strict -summary -ignore-missing-schemas || exit 1
          done
          echo "All rendered charts passed kubeconform."

      - name: Install helm-unittest
        run: |
          HELM_UNITTEST_VERSION=v1.1.2
          HELM_UNITTEST_SHA256="de03d6b7ba7683282064702d0b36fbbe812ab2a22691fa3a8b2ce57c2682609c"
          PLUGIN_DIR="$(helm env HELM_PLUGINS)/unittest"
          mkdir -p "$PLUGIN_DIR"
          curl -sSL "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-1.1.2.tgz" -o /tmp/helm-unittest.tgz
          echo "${HELM_UNITTEST_SHA256}  /tmp/helm-unittest.tgz" | sha256sum -c -
          tar xz -C "$PLUGIN_DIR" -f /tmp/helm-unittest.tgz
          rm /tmp/helm-unittest.tgz

      - name: Unit test Helm Charts
        run: |
          test_dirs=$(find infrastructure applications -type d -name tests 2>/dev/null)
          if [ -z "$test_dirs" ]; then
            echo "No tests found; skipping helm unittest"
          else
            for dir in $test_dirs; do
              chart=$(dirname "$dir")
              helm unittest "$chart" || exit 1
            done
          fi

      - name: Verify PostgreSQL Connection Limits
        run: |
          MAX_CONNS=$(yq '.spec.postgresql.parameters.max_connections' infrastructure/platform-postgresql/cluster.yaml)
          echo "PostgreSQL max_connections: $MAX_CONNS"

          RESERVED_CONNS=15
          SERVICE_LIMIT=$((MAX_CONNS - RESERVED_CONNS))
          echo "Service connection budget: $SERVICE_LIMIT (reserving $RESERVED_CONNS for CNPG system operations)"

          TOTAL_LIMIT=$(grep "connectionLimit:" infrastructure/platform-postgresql/database-role.yaml | awk '{sum += $2} END {print sum}')
          echo "Total DatabaseRole connectionLimit sum: $TOTAL_LIMIT"

          if [ "$TOTAL_LIMIT" -gt "$SERVICE_LIMIT" ]; then
            echo "ERROR: Total connectionLimit ($TOTAL_LIMIT) exceeds the service budget ($SERVICE_LIMIT), which reserves $RESERVED_CONNS connections for CNPG operations!"
            exit 1
          fi
          echo "OK: Connection limit total ($TOTAL_LIMIT) is within service budget ($SERVICE_LIMIT)."
