replicaCount: 1

image:
  repository: stefanprodan/podinfo
  tag: 6.5.4
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: backend.freecloudinitiative.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backend-tls
      hosts:
        - backend.freecloudinitiative.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 100Mi

automountServiceAccountToken: false
