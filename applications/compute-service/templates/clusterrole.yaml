# Cluster-scoped ClusterRole for compute-service.
# compute-service must read Namespace objects to resolve account namespaces
# and must manage workload resources (Pods, Deployments, RBAC) inside
# fci-cust-* namespaces via per-namespace RoleBindings (see role-template.yaml).
# Write access to cluster-scoped resources (Namespaces, ClusterRoles) is
# intentionally NOT included — namespace creation is a separate provisioning
# path controlled by RBAC at deploy time.
#
# The create/escalate/bind grants below are cluster-wide and RBAC alone
# cannot restrict *which* namespace or subject they're used against — see
# infrastructure/kyverno-policies/restrict-compute-service-rbac-writes.yaml
# for the admission-time restriction to fci-cust-* namespaces and the four
# approved backend service accounts that closes that gap.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "compute-service.fullname" . }}-cluster
  labels:
    {{- include "compute-service.labels" . | nindent 4 }}
rules:
  # Read namespaces to resolve account-to-namespace mapping and check
  # whether a namespace already exists before attempting to provision it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Create, update, and delete customer namespaces during provisioning and
  # teardown. RBAC cannot restrict cluster-scoped writes to a name prefix
  # pattern, so this is tightly documented — compute-service must only
  # operate on fci-cust-* namespaces as enforced by application logic.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "update", "patch", "delete"]
  # Read RuntimeClass objects to check Kata availability for
  # instance-type capability detection (InstanceTypeCacheTTL).
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  # Read node labels to detect ready/labelled nodes for instance types.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Provision and reconcile the namespaced Roles this chart owns
  # (compute-service-workloads, terminal-gateway-exec — see rbac.go) inside
  # every fci-cust-* namespace. "escalate" is required by Kubernetes' RBAC
  # self-escalation prevention: a subject may only create/update a Role
  # containing rules it doesn't already hold if it has "escalate" on roles.
  # resourceNames restricts get/update/patch/delete to these two names —
  # RBAC does not support resourceNames on create/list/watch, so those
  # verbs are only bounded by application logic (rbac.go's hard-coded
  # role names), not by this rule.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["compute-service-workloads", "terminal-gateway-exec"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete", "escalate"]
  # Create the RoleBindings that grant the above Roles, plus the
  # storage-service-namespace-role / database-service-namespace-role
  # ClusterRoles owned by their respective charts (see role-template.yaml
  # and internal/k8s/rbac.go). Same resourceNames caveat as above applies.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["compute-service-workloads", "terminal-gateway-exec",
                     "storage-service-namespace", "database-service-namespace"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # "bind" grants permission to reference a ClusterRole this chart doesn't
  # itself hold the rules of — required by the same RBAC self-escalation
  # rule as "escalate" above, but for RoleBindings whose roleRef.kind is
  # ClusterRole. Scoped to the two cross-repo ClusterRoles rbac.go binds by
  # name (defaults documented in compute-service's internal/k8s/config.go).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["storage-service-namespace-role", "database-service-namespace-role"]
    verbs: ["bind"]
