# role-template.yaml — the namespace-scoped workload management grant,
# expressed as a ClusterRole rather than a namespaced Role.
#
# Customer namespaces are created by compute-service at runtime, so this
# chart cannot know their names at deploy time and cannot create a
# namespaced Role in each one. Instead this ClusterRole is a *template*:
# it defines exactly the verb set a customer namespace's RoleBinding should
# grant. compute-service creates a namespace-scoped RoleBinding referencing
# this ClusterRole by name whenever it provisions a fci-cust-* namespace.
#
# This ClusterRole is intentionally NOT referenced by any
# ClusterRoleBinding in this chart. Binding it cluster-wide would grant
# workload write access to every namespace, including platform ones.
# It only takes effect where a namespace-scoped RoleBinding names it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "compute-service.fullname" . }}-namespace-role
  labels:
    {{- include "compute-service.labels" . | nindent 4 }}
    fci.io/rbac-scope: namespace-template
rules:
  # Core workload resources needed to provision and manage compute instances
  # inside a customer namespace.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "pods/status", "services",
                "serviceaccounts", "configmaps", "persistentvolumeclaims",
                "resourcequotas", "limitranges"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Deployment and replica management.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # RBAC grants inside the customer namespace (e.g. terminal-gateway exec access).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "update"]
