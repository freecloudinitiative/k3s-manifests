apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runtime-config
  labels:
    app: {{ .Release.Name }}
data:
  config.js: |
    window.__FCI_CONFIG__ = {{ dict
      "appEnv" .Values.runtimeConfig.appEnv
      "apiBaseUrl" .Values.runtimeConfig.apiBaseUrl
      "oidcAuthority" .Values.runtimeConfig.oidcAuthority
      "oidcClientId" .Values.runtimeConfig.oidcClientId
      "oidcRedirectUri" .Values.runtimeConfig.oidcRedirectUri
      "enableRealTerminal" .Values.runtimeConfig.enableRealTerminal
      "wsBaseUrl" .Values.runtimeConfig.wsBaseUrl
      | toJson }};
