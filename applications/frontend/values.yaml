replicaCount: 2

image:
  # Replaced by CI with the frontend image. Pin digest for releases.
  repository: nginxdemos/hello
  tag: plain-text
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

env:
  apiBackendUrl: "http://backend.backend.svc.cluster.local:80"

extraEnv: []

runtimeConfig:
  appEnv: prod
  apiBaseUrl: ""
  oidcAuthority: "https://auth.freecloudinitiative.com/application/o/freecloudinitiative/"
  oidcClientId: "freecloudinitiative-frontend"
  oidcRedirectUri: "https://frontend.freecloudinitiative.com/callback"
  enableRealTerminal: false
  wsBaseUrl: ""

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-public-chain@kubernetescrd
  hosts:
    - host: frontend.freecloudinitiative.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frontend-tls
      hosts:
        - frontend.freecloudinitiative.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 100Mi

automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
