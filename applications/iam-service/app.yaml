apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iam-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/freecloudinitiative/k3s-manifests.git'
    targetRevision: HEAD
    path: applications/iam-service
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # Placeholder: iam-service has no build pipeline yet (no
        # build-arm64-image.yml workflow in that repo), so there is no real
        # tag to put here. automated sync is deliberately OFF below —
        # ArgoCD would otherwise apply this placeholder immediately and
        # spin up a Deployment stuck in ImagePullBackOff. Once a real image
        # is published, set image.tag to the real sha AND re-enable
        # syncPolicy.automated in the same change.
        - name: image.tag
          value: "sha-xxxxxxxxxxxx"
        - name: imagePullSecrets[0].name
          value: zot-registry-pull-credentials
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: backend
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
