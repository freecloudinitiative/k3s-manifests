replicaCount: 1

image:
  repository: nginxdemos/hello
  tag: plain-text
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: sample-app.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 100Mi

automountServiceAccountToken: false
