replicaCount: 1

image:
  repository: nginxdemos/hello
  tag: plain-text
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sample-app.freecloudinitiative.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sample-app-tls
      hosts:
        - sample-app.freecloudinitiative.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: 200m
    memory: 128Mi
    ephemeral-storage: 100Mi

automountServiceAccountToken: false
