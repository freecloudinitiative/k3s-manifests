{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "storage-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "storage-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "storage-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # api-gateway and other backend-namespace peers reach the API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: {{ .Values.service.containerPort }}
    # Prometheus scrapes metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # platform-database (Postgres)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-database
      ports:
        - protocol: TCP
          port: 5432
    # valkey (quota cache)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: valkey
      ports:
        - protocol: TCP
          port: 6379
    # the Kubernetes API server. NetworkPolicy cannot express the
    # control-plane endpoint as a namespace/pod selector, so this uses an
    # ipBlock for the cluster's Service CIDR rather than silently omitting
    # egress restriction for this destination (an omission is how a
    # NetworkPolicy appears complete while permitting everything).
    - to:
        - ipBlock:
            cidr: {{ .Values.clusterCIDRs.service }}
      ports:
        - protocol: TCP
          port: 443
    # the object-store namespace, on its private S3 API port.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: garage
      ports:
        - protocol: TCP
          port: 3900
    # backend (iam-service, for quota checks)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: 8080
    # OTLP trace/metric export to the OpenTelemetry collector in monitoring.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317
{{- end }}
