tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

alloy:
  clustering:
    enabled: false

  configMap:
    content: |
      logging {
        level  = "info"
        format = "json"
      }

      ui {
        path_prefix = "/alloy"
      }

      // Receive OTLP from apps
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.exporter.prometheus.default.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
          logs    = [otelcol.exporter.loki.default.input]
        }
      }

      // Convert OTLP metrics to Prometheus remote write format
      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.default.receiver]
      }

      // Convert OTLP logs to Loki format
      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      // Send traces to Tempo
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      // Send logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-external.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // Scrape Prometheus metrics
      prometheus.scrape "default" {
        targets = [
          {"__address__" = "kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"},
        ]
        forward_to = [prometheus.remote_write.default.receiver]
      }

      // Send metrics to Prometheus
      prometheus.remote_write "default" {
        endpoint {
          url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }

