apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  freecloudinitiative.yaml: |
    version: 1
    metadata:
      name: Free Cloud Initiative frontend OIDC
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: freecloudinitiative-frontend-provider
        identifiers:
          name: freecloudinitiative-frontend
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: freecloudinitiative-frontend
          grant_types:
            - authorization_code
            - refresh_token
          # Stable subject identifier: the frontend's OIDC `sub` is the join key
          # for the platform account row, so it must not change when a user
          # edits their email or username.
          sub_mode: hashed_user_id
          access_code_validity: minutes=1
          access_token_validity: minutes=10
          refresh_token_validity: days=14
          redirect_uris:
            - matching_mode: strict
              url: https://freecloudinitiative.com/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            # Required for the refresh_token grant. Without it the SPA gets no
            # refresh token and react-oidc-context falls back to a hidden iframe
            # that the frontend CSP blocks — sessions then die at access-token
            # expiry. See frontend/src/lib/oidc.ts.
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: freecloudinitiative
        attrs:
          name: Free Cloud Initiative
          provider: !KeyOf freecloudinitiative-frontend-provider
          policy_engine_mode: any

      # GROUPS
      - model: authentik_core.group
        identifiers:
          name: grafana-admins
      - model: authentik_core.group
        identifiers:
          name: argocd-admins
      - model: authentik_core.group
        identifiers:
          name: vault-admins
      - model: authentik_core.group
        identifiers:
          name: registry-admins

      # FCI IAM role groups. iam-service adds each provisioned user to exactly
      # one of these, keyed by iam.users.role. Names are a cross-repo contract
      # with iam-service/internal/authz — do not rename without changing both.
      - model: authentik_core.group
        identifiers:
          name: fci-admin
      - model: authentik_core.group
        identifiers:
          name: fci-editor
      - model: authentik_core.group
        identifiers:
          name: fci-viewer
      - model: authentik_core.group
        identifiers:
          name: fci-auditor

      # GRAFANA
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana-oidc
          client_secret: !Env GRAFANA_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.freecloudinitiative.com/grafana/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider

      # ARGOCD
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd-oidc
          client_secret: !Env ARGOCD_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.freecloudinitiative.com/api/dex/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider

      # PROXY FORWARD AUTH
      - model: authentik_providers_proxy.proxyprovider
        id: prometheus-proxy
        identifiers:
          name: prometheus
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://prometheus.freecloudinitiative.com
          mode: forward_single
      - model: authentik_core.application
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-proxy

      - model: authentik_providers_proxy.proxyprovider
        id: alloy-proxy
        identifiers:
          name: alloy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://alloy.freecloudinitiative.com
          mode: forward_single
      - model: authentik_core.application
        identifiers:
          slug: alloy
        attrs:
          name: Alloy
          provider: !KeyOf alloy-proxy

      - model: authentik_providers_proxy.proxyprovider
        id: longhorn-proxy
        identifiers:
          name: longhorn
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://longhorn.freecloudinitiative.com
          mode: forward_single
      - model: authentik_core.application
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          provider: !KeyOf longhorn-proxy
