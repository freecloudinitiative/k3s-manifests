apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  freecloudinitiative.yaml: |
    version: 1
    metadata:
      name: Free Cloud Initiative frontend OIDC
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: freecloudinitiative-frontend-provider
        identifiers:
          name: freecloudinitiative-frontend
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: freecloudinitiative-frontend
          grant_types:
            - authorization_code
            - refresh_token
          # Stable subject identifier: the frontend's OIDC `sub` is the join key
          # for the platform account row, so it must not change when a user
          # edits their email or username.
          sub_mode: hashed_user_id
          access_code_validity: minutes=1
          access_token_validity: minutes=10
          refresh_token_validity: days=14
          redirect_uris:
            - matching_mode: strict
              url: https://freecloudinitiative.com/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            # Required for the refresh_token grant. Without it the SPA gets no
            # refresh token and react-oidc-context falls back to a hidden iframe
            # that the frontend CSP blocks — sessions then die at access-token
            # expiry. See frontend/src/lib/oidc.ts.
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: freecloudinitiative
        attrs:
          name: Free Cloud Initiative
          provider: !KeyOf freecloudinitiative-frontend-provider
          policy_engine_mode: any

      # GROUPS
      - model: authentik_core.group
        identifiers:
          name: grafana-admins
      - model: authentik_core.group
        identifiers:
          name: argocd-admins
      - model: authentik_core.group
        identifiers:
          name: vault-admins
      - model: authentik_core.group
        identifiers:
          name: registry-admins

      # FCI IAM role groups. iam-service adds each provisioned user to exactly
      # one of these, keyed by iam.users.role. Names are a cross-repo contract
      # with iam-service/internal/authz — do not rename without changing both.
      - model: authentik_core.group
        identifiers:
          name: fci-admin
      - model: authentik_core.group
        identifiers:
          name: fci-editor
      - model: authentik_core.group
        identifiers:
          name: fci-viewer
      - model: authentik_core.group
        identifiers:
          name: fci-auditor

      # GRAFANA
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: grafana-oidc
          client_secret: !Env GRAFANA_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.freecloudinitiative.com/grafana/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider

      # ARGOCD
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd-oidc
          client_secret: !Env ARGOCD_OIDC_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.freecloudinitiative.com/api/dex/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider

      # PROXY FORWARD AUTH
      - model: authentik_providers_proxy.proxyprovider
        id: prometheus-proxy
        identifiers:
          name: prometheus
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://prometheus.freecloudinitiative.com
          mode: forward_single
      - model: authentik_core.application
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-proxy

      - model: authentik_providers_proxy.proxyprovider
        id: alloy-proxy
        identifiers:
          name: alloy
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://alloy.freecloudinitiative.com
          mode: forward_single
      - model: authentik_core.application
        identifiers:
          slug: alloy
        attrs:
          name: Alloy
          provider: !KeyOf alloy-proxy

      - model: authentik_providers_proxy.proxyprovider
        id: longhorn-proxy
        identifiers:
          name: longhorn
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          external_host: https://longhorn.freecloudinitiative.com
          mode: forward_single
      - model: authentik_core.application
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          provider: !KeyOf longhorn-proxy
  enrollment.yaml: |
    version: 1
    metadata:
      name: Free Cloud Initiative self-service enrollment
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Checks the two password prompts match. authentik ships no built-in
      # policy for this -- every "add a signup flow" example defines its own
      # tiny expression policy, so this mirrors that pattern.
      - model: authentik_policies_expression.expressionpolicy
        id: enrollment-password-match-policy
        identifiers:
          name: enrollment-password-match
        attrs:
          expression: |
            return request.context.get('prompt_data', {}).get('password') == request.context.get('prompt_data', {}).get('password_repeat')

      - model: authentik_stages_prompt.prompt
        id: enrollment-prompt-username
        identifiers:
          field_key: username
          name: enrollment-username
        attrs:
          label: Username
          type: username
          required: true
          placeholder: Username
          order: 0
      - model: authentik_stages_prompt.prompt
        id: enrollment-prompt-name
        identifiers:
          field_key: name
          name: enrollment-name
        attrs:
          label: Name
          type: text
          required: true
          placeholder: Name
          order: 1
      - model: authentik_stages_prompt.prompt
        id: enrollment-prompt-email
        identifiers:
          field_key: email
          name: enrollment-email
        attrs:
          label: Email
          type: email
          required: true
          placeholder: Email
          order: 2
      - model: authentik_stages_prompt.prompt
        id: enrollment-prompt-password
        identifiers:
          field_key: password
          name: enrollment-password
        attrs:
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 3
      - model: authentik_stages_prompt.prompt
        id: enrollment-prompt-password-repeat
        identifiers:
          field_key: password_repeat
          name: enrollment-password-repeat
        attrs:
          label: Password (repeat)
          type: password
          required: true
          placeholder: Repeat password
          order: 4

      - model: authentik_stages_prompt.promptstage
        id: enrollment-prompt-stage
        identifiers:
          name: enrollment-details-prompt
        attrs:
          fields:
            - !KeyOf enrollment-prompt-username
            - !KeyOf enrollment-prompt-name
            - !KeyOf enrollment-prompt-email
            - !KeyOf enrollment-prompt-password
            - !KeyOf enrollment-prompt-password-repeat
          validation_policies:
            - !KeyOf enrollment-password-match-policy

      - model: authentik_stages_user_write.userwritestage
        id: enrollment-user-write-stage
        identifiers:
          name: enrollment-user-write

      - model: authentik_stages_user_login.userloginstage
        id: enrollment-user-login-stage
        identifiers:
          name: enrollment-user-login

      - model: authentik_flows.flow
        id: enrollment-flow
        identifiers:
          slug: default-enrollment-flow
        attrs:
          name: Free Cloud Initiative signup
          title: Welcome to Free Cloud Initiative!
          designation: enrollment
          authentication: require_unauthenticated

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !KeyOf enrollment-prompt-stage
        attrs:
          order: 10
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !KeyOf enrollment-user-write-stage
        attrs:
          order: 20
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !KeyOf enrollment-user-login-stage
        attrs:
          order: 30

      # Without this, a login or signup started directly at
      # auth.freecloudinitiative.com (no app/client_id context -- exactly
      # what a fresh signup is, since the enrollment flow above runs on
      # this domain with no redirect_uri) lands on authentik's own "My
      # applications" page instead of the app. Setting the default Brand's
      # default_application makes authentik immediately continue into this
      # application's own OIDC flow, which lands the user back on
      # freecloudinitiative.com/callback like a normal login does.
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          default_application: !Find [authentik_core.application, [slug, freecloudinitiative]]

      # "Sign in with Google" button on the login screen. Client
      # credentials come from OpenBao via external-secret-authentik.yaml
      # (GOOGLE_OAUTH_CLIENT_ID/SECRET), seeded by
      # ansible-automation's AUTHENTIK_GOOGLE_CLIENT_ID/SECRET. Redirect
      # URI registered on the Google Cloud OAuth client must be
      # https://auth.freecloudinitiative.com/source/oauth/callback/google/
      # -- the slug below ("google") is baked into that URL.
      - model: authentik_sources_oauth.oauthsource
        id: google-oauth-source
        identifiers:
          slug: google
        attrs:
          name: Google
          provider_type: google
          consumer_key: !Env GOOGLE_OAUTH_CLIENT_ID
          consumer_secret: !Env GOOGLE_OAUTH_CLIENT_SECRET
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
          pre_authentication_flow: !Find [authentik_flows.flow, [slug, default-source-pre-authentication]]

      # Puts the "Sign up" and "Sign in with Google" affordances on the
      # login screen. state: present + matching identifiers updates this
      # existing built-in object rather than creating a new one -- doing
      # so re-validates the whole serializer, so user_fields has to be
      # repeated here even though it isn't changing.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields:
            - email
            - username
          enrollment_flow: !KeyOf enrollment-flow
          sources:
            - !KeyOf google-oauth-source
