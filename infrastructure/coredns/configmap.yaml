apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # K3s imports *.server fragments from this ConfigMap. Keep the public DNS
  # name as the URL/Host/TLS identity, but resolve it to Traefik's ClusterIP
  # for in-cluster OAuth clients. This avoids sending Argo CD and Grafana's
  # Authentik traffic out through Cloudflare and back through the tunnel.
  authentik.server: |
    auth.freecloudinitiative.com:53 {
      errors
      cache 30
      rewrite name exact auth.freecloudinitiative.com traefik.traefik.svc.cluster.local
      kubernetes cluster.local in-addr.arpa ip6.arpa
    }
