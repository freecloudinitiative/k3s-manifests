apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: authentik-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .postgresqlPassword }}"
        AUTHENTIK_SECRET_KEY: "{{ .secretKey }}"
        GRAFANA_OIDC_SECRET: "{{ .grafanaOidcSecret }}"
        ARGOCD_OIDC_SECRET: "{{ .argocdOidcSecret }}"
  data:
    - secretKey: postgresqlPassword
      remoteRef:
        key: authentik
        property: postgresql-password
    - secretKey: secretKey
      remoteRef:
        key: authentik
        property: secret-key
    - secretKey: grafanaOidcSecret
      remoteRef:
        key: authentik
        property: grafana-oidc-secret
    - secretKey: argocdOidcSecret
      remoteRef:
        key: authentik
        property: argocd-oidc-secret
---
apiVersion: external-secrets.io/v1
