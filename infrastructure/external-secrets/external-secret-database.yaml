# ExternalSecret for database-service: Postgres credentials in platform-database.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "-2" ensures the Secret lands before the DatabaseRole reconciles
# (wave "1") and before database-service pods attempt to mount it.
---
# CNPG's DatabaseRole.spec.passwordSecret is a same-namespace Secret
# reference resolved wherever the DatabaseRole itself is reconciled — the
# platform-postgresql Argo Application's destination namespace,
# platform-database (see infrastructure/platform-postgresql/app.yaml) —
# never wherever the consuming service happens to live. A copy in backend
# would be invisible to CNPG's reconcile and the role's password would
# silently never update. See external-secret-storage.yaml:11-19 for the
# full rationale.
#
# OpenBao prerequisite: the key database/postgresql-password must exist in
# OpenBao at secret/data/database (KV v2). OpenBao is seeded out of band; an
# ExternalSecret pointing at a missing key stays SecretSyncedError forever
# with no other signal. Backend-namespace copies consumed by database-service
# pods are created in PR-03, which extends this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-postgresql-credentials
  namespace: platform-database
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: database-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: database
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: database
        property: postgresql-password
---
# The chart-facing copy: database-service's Deployment reads DATABASE_URL
# from this Secret's `DATABASE_URL` key via secretKeyRef, in the backend
# namespace where the pods actually run (confirmed from
# database-service/deploy/templates/deployment.yaml: secretKeyRef
# {name: database-service-config, key: DATABASE_URL}). The key is literally
# DATABASE_URL — not `url` as in storage-service-postgresql-credentials.
# sslrootcert points at /certs/platform-postgresql/ca.crt, which is the
# exact path the chart mounts: volumeMounts.mountPath=/certs/platform-postgresql
# + items[].path=ca.crt.
#
# PR-03 parallel: platform-postgresql-ca-bundle Certificate in backend
# (infrastructure/platform-postgresql/certificate.yaml) must be ready before
# sslmode=verify-full succeeds. That Certificate is at sync-wave "2"; this
# ExternalSecret resolves at wave -2 and the pod starts after both are present.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-config
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: database-service-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://database:{{ .password }}@platform-postgresql-rw.platform-database.svc.cluster.local:5432/platform?sslmode=verify-full&sslrootcert=/certs/platform-postgresql/ca.crt"
  data:
    - secretKey: password
      remoteRef:
        key: database
        property: postgresql-password
---
# database-service verifies inbound internal calls (from api-gateway) but never
# signs its own — only the public half is mounted here. The private half lives
# in api-gateway-signing-key (external-secret-gateway.yaml). Sourced from the
# same OpenBao key as storage-service-internal-public-key (api-gateway /
# internal-public-key) — a mismatched pair produces 401s that look like a
# client bug, so the source must be the public counterpart of the exact private
# key api-gateway uses to sign tokens.
#
# Follow-up: the chart names this Secret `internal-token-public-key` rather
# than `database-service-internal-public-key`. This is an inconsistency with
# the storage-service naming convention. Renaming requires a chart change in
# the database-service repo — tracked as a follow-up, not fixed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-service-internal-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: internal-token-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: api-gateway
        property: internal-public-key
