# Docker registry credentials for the frontend workload in namespace frontend.
#
# registry.freecloudinitiative.com is protected by the Traefik basicAuth
# middleware declared in infrastructure/zot-registry/middleware.yaml. The
# container runtime therefore needs this pull Secret even though Zot itself
# has no authentication block in config.json.
#
# Same OpenBao secret as external-secret-registry.yaml (namespace backend) —
# duplicated per-namespace because ExternalSecrets don't cross namespaces.
#
# OpenBao prerequisite: secret/data/zot-registry must contain the plaintext
# properties pull-username, pull-password, ghcr-username, and ghcr-token.
# The Zot user must also appear in the existing htpasswd property. A password
# hash cannot be converted back into credentials usable by a container runtime.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-registry-pull-credentials
  namespace: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: zot-registry-pull-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .ghcrUsername .ghcrToken | b64enc }}"
              },
              "registry.freecloudinitiative.com": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: ghcrUsername
      remoteRef:
        key: zot-registry
        property: ghcr-username
    - secretKey: ghcrToken
      remoteRef:
        key: zot-registry
        property: ghcr-token
    - secretKey: username
      remoteRef:
        key: zot-registry
        property: pull-username
    - secretKey: password
      remoteRef:
        key: zot-registry
        property: pull-password
