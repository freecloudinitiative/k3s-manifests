# ExternalSecret for storage-service: Postgres credentials + CA, object
# store credentials + CA, Valkey password + CA, and the internal Ed25519
# public key used to verify inbound internal calls.
#
# apiVersion must be external-secrets.io/v1 — not v1beta1, which the pinned
# ESO chart no longer serves.
#
# sync-wave "-2" ensures secrets land before any storage-service Deployment
# pods attempt to mount them.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-postgresql-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # `password` is the plain value the platform-postgresql
        # DatabaseRole's passwordSecret reads to set the role's password in
        # Postgres (see database-role.yaml's storage-role). `url` is the
        # full DSN the chart injects as DATABASE_URL — sslrootcert points
        # at the CA bundle mounted from storage-service-postgresql-ca-cert
        # below, so the two secrets are consumed together.
        password: "{{ .password }}"
        url: "postgres://storage:{{ .password }}@platform-postgresql-rw.platform-database.svc.cluster.local:5432/platform?sslmode=verify-full&sslrootcert=/etc/storage-service/postgres/ca.crt"
  data:
    - secretKey: password
      remoteRef:
        key: storage
        property: postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-postgresql-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-postgresql-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: platform-postgresql
        property: ca-cert
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-valkey-password
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-valkey-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: valkey
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-valkey-ca-cert
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-valkey-ca-cert
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: valkey
        property: ca-cert
---
# storage-service verifies inbound internal calls (from api-gateway) but
# never signs its own — only the public half is mounted here. Mirrors the
# terminal-gateway-public-key pattern: the signing service owns the private
# key, every verifier gets only the public one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-internal-public-key
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-internal-public-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: internal-public.pem
      remoteRef:
        key: api-gateway
        property: internal-public-key
---
# Object store (garage) credentials + CA. Mounted as files by the chart —
# never injected as process environment — per prs/PR-11-helm-chart-rbac.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service-objectstore-credentials
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: storage-service-objectstore-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key
      remoteRef:
        key: garage
        property: storage-service-access-key
    - secretKey: secret-key
      remoteRef:
        key: garage
        property: storage-service-secret-key
    - secretKey: ca.crt
      remoteRef:
        key: garage
        property: ca-cert
