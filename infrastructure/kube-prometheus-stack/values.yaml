prometheus:
  prometheusSpec:
    externalUrl: "/prometheus/"
    routePrefix: /prometheus
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 150m
        memory: 500Mi
      limits:
        cpu: 1000m
        memory: 1.5Gi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-external.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
        derivedFields:
          - name: TraceID
            matcherRegex: "(?:trace_id|traceId|traceID)=(\\w+)"
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo-external.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false
      jsonData:
        httpMethod: GET
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          tags: ['job', 'instance', 'pod', 'namespace', 'app']
          filterByTraceID: true
          filterBySpanID: false
          customQuery: true
          query: '{app="${__tags.app}"} |= "${__trace.id}"'
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  grafana.ini:
    database:
      wal: true
      cache_mode: shared
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
    patch:
      enabled: false
