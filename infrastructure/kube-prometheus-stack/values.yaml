prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 150m
        memory: 500Mi
      limits:
        cpu: 1000m
        memory: 1.5Gi

grafana:
  enabled: true
  adminPassword: "ChangeMe123!GrafanaAdmin"
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      jsonData:
        maxLines: 1000
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
      serve_from_sub_path: false

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true
    patch:
      enabled: false
