apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must declare CPU/memory requests and limits so a
      single misbehaving workload can't starve a node.
spec:
  # spec.validationFailureAction has had no effect since Kyverno 1.13 (the
  # chart pinned in infrastructure/kyverno/app.yaml is 3.8.1, well past
  # that) — it's deprecated in favor of a per-rule failureAction under each
  # rule's validate block, set below. Leaving only the top-level field would
  # silently run this policy in Kyverno's default (non-enforcing) mode.
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Audit
        message: "CPU and memory requests/limits are required on every container."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
