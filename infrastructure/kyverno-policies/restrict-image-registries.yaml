apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Flags images pulled from outside the approved registry allowlist.
      Enforced: FCI workloads pull from ghcr.io (PR-04) and
      registry.freecloudinitiative.com (the platform's own Zot registry —
      source of customer compute-instance OS images and the target for the
      backend image migration). docker.io, quay.io, and registry.k8s.io
      remain allowed for upstream infrastructure charts (Traefik, Longhorn,
      CNPG, Authentik, kube-prometheus-stack, ...).
spec:
  # spec.validationFailureAction has had no effect since Kyverno 1.11 (the
  # chart pinned in infrastructure/kyverno/app.yaml is 3.8.1, well past
  # that) — it's deprecated in favor of a per-rule failureAction under the
  # rule's validate block, set below. Leaving only the top-level field
  # would silently run this policy in Kyverno's default (non-enforcing)
  # mode instead of the Enforce this policy depends on.
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "Image registry is not in the approved allowlist."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AllNotIn
                    value: &allowed-registries
                      - "ghcr.io/*"
                      - "quay.io/*"
                      - "docker.io/*"
                      - "registry.k8s.io/*"
                      # Platform's own Zot registry: source of customer
                      # compute-instance OS images, and the eventual source
                      # of all backend images.
                      - "registry.freecloudinitiative.com/*"
          - list: "request.object.spec.initContainers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AllNotIn
                    value: *allowed-registries
