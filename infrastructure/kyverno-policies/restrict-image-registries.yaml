apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Flags images pulled from outside the approved registry allowlist.
      Audit-only for now: most workloads still reference public images
      directly and haven't migrated to the private zot-registry yet. Once
      that migration lands, tighten the allowlist and consider enforcing.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Image registry is not in the approved allowlist."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AllNotIn
                    value:
                      - "ghcr.io/*"
                      - "quay.io/*"
                      - "docker.io/*"
                      - "zot-registry.zot-registry.svc.cluster.local:*/*"
                      - "registry.freecloudinitiative.com/*"
                      - "registry.k8s.io/*"
