apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Flags images pulled from outside the approved registry allowlist.
      Enforced: FCI workloads pull from ghcr.io (PR-04); registry.freecloudinitiative.com
      (Zot) and the in-cluster zot-registry proxy are not yet used by any
      workload and are excluded until that migration lands. docker.io,
      quay.io, and registry.k8s.io remain allowed for upstream infrastructure
      charts (Traefik, Longhorn, CNPG, Authentik, kube-prometheus-stack, ...).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Image registry is not in the approved allowlist."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AllNotIn
                    value: &allowed-registries
                      - "ghcr.io/*"
                      - "quay.io/*"
                      - "docker.io/*"
                      - "registry.k8s.io/*"
          - list: "request.object.spec.initContainers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AllNotIn
                    value: *allowed-registries
