apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-labels
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require Pod Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Pods must carry 'app' and 'env' labels for observability and cost attribution.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-pod-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must have 'app' and 'env' labels."
        pattern:
          metadata:
            labels:
              app: "?*"
              env: "?*"
