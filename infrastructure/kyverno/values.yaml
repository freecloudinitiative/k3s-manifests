admissionController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cleanupController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

features:
  policyExceptions:
    enabled: true

grafana:
  enabled: false

cleanupJobs:
  admissionReports:
    image:
      repository: rancher/kubectl
      tag: v1.30.2
  clusterAdmissionReports:
    image:
      repository: rancher/kubectl
      tag: v1.30.2

webhooksCleanup:
  image:
    repository: rancher/kubectl
    tag: v1.30.2
