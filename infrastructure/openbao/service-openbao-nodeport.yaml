apiVersion: v1
kind: Service
metadata:
  name: openbao-nodeport
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: openbao
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: openbao
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30200
