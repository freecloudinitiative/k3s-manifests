apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-postgresql-server
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: platform-postgresql-server-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - platform-postgresql-rw
    - platform-postgresql-rw.platform-database
    - platform-postgresql-rw.platform-database.svc
    - platform-postgresql-rw.platform-database.svc.cluster.local
    - platform-postgresql-ro
    - platform-postgresql-ro.platform-database
    - platform-postgresql-ro.platform-database.svc
    - platform-postgresql-ro.platform-database.svc.cluster.local
    - platform-postgresql-r
    - platform-postgresql-r.platform-database
    - platform-postgresql-r.platform-database.svc
    - platform-postgresql-r.platform-database.svc.cluster.local
  issuerRef:
    name: ca-cluster-issuer
    kind: ClusterIssuer
---
# CA bundle for backend-namespace consumers (database-service).
#
# Why a second Certificate rather than an ExternalSecret:
#   infrastructure/cert-manager/cluster-issuer-ca.yaml is a ClusterIssuer —
#   cluster-scoped, so it can issue certificates into any namespace. cert-manager
#   then writes the resulting Secret directly into backend, and handles
#   renewal automatically. No manual OpenBao seeding required; no dependency on
#   the CA cert already being in OpenBao's KV store.
#
# Why this file (platform-postgresql/), not authentik/:
#   The CA logically belongs to the database it authenticates. The existing copy
#   in authentik/ was an accident of namespace inheritance — that Certificate has
#   no metadata.namespace, so it inherits the Authentik Application's destination
#   (authentik). That inheritance has been fixed in infrastructure/authentik/
#   certificate.yaml by adding an explicit metadata.namespace: authentik.
#
# sync-wave "2": ca-cluster-issuer (wave "1") must be ready before cert-manager
# can issue against it. This is later than the ExternalSecrets (wave "-2") but
# still before application workloads (no explicit wave = wave 0 or later).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-postgresql-ca-bundle-backend
  namespace: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: platform-postgresql-ca-bundle
  duration: 2160h
  renewBefore: 360h
  commonName: database-service-postgresql-client
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
  issuerRef:
    name: ca-cluster-issuer
    kind: ClusterIssuer
