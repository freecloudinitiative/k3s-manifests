# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  enableSuperuserAccess: false
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  failoverDelay: 30
  switchoverDelay: 3600
  stopDelay: 1800
  smartShutdownTimeout: 300

  bootstrap:
    initdb:
      database: platform
      owner: platform
      secret:
        name: platform-postgresql-credentials
      dataChecksums: true
      encoding: UTF8

  certificates:
    serverCASecret: platform-postgresql-server-tls
    serverTLSSecret: platform-postgresql-server-tls

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.2
      shared_buffers: 256MB
      # Role limits total 245 of 260; 15 connections remain for CNPG superuser,
      # replication, and pg_monitor. Higher max_connections increases per-backend
      # memory on Raspberry Pi nodes; shared_buffers remains 256MB.
      max_connections: "260"
    pg_hba:
      - hostnossl all all all reject

  storage:
    storageClass: local-path
    size: 20Gi
    resizeInUseVolumes: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Required anti-affinity needs one schedulable node per instance. The
    # k3s-node-labeling role taints the low-memory worker with
    # memory=limited:NoSchedule, which would otherwise leave only two eligible
    # nodes for three instances and hang the third replica in Pending forever.
    tolerations:
      - key: memory
        operator: Equal
        value: limited
        effect: NoSchedule

  monitoring:
    enablePodMonitor: true

  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: freecloud-platform
      app.kubernetes.io/component: database
