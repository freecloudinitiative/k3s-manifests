# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  enableSuperuserAccess: false
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  failoverDelay: 30
  switchoverDelay: 3600
  stopDelay: 1800
  smartShutdownTimeout: 300

  bootstrap:
    initdb:
      database: platform
      owner: platform
      secret:
        name: platform-postgresql-credentials
      dataChecksums: true
      encoding: UTF8

  certificates:
    serverCASecret: platform-postgresql-server-tls
    serverTLSSecret: platform-postgresql-server-tls

  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.2
      shared_buffers: 256MB
      # Role limits total 245 of 260; 15 connections remain for CNPG superuser,
      # replication, and pg_monitor. Higher max_connections increases per-backend
      # memory on Raspberry Pi nodes; shared_buffers remains 256MB.
      max_connections: "260"
      # 2026-09-01 incident: repeated authentik-server crash-loops (pods
      # SIGKILLed mid-request) left connections open on the postgres side
      # that were never cleanly closed by the client. With no idle timeout
      # configured, those held their slot in the authentik role's
      # connectionLimit indefinitely -- "too many connections for role
      # authentik" persisted even after scaling authentik-server down to a
      # single, healthy replica, because the accumulated dead connections
      # from the incident window, not live traffic, were consuming the
      # budget. idle_session_timeout reaps any session sitting idle outside
      # a transaction (the common case for a pooled/reused Django
      # connection whose client vanished); idle_in_transaction_session_timeout
      # is the same for a connection stuck mid-transaction. tcp_keepalives_*
      # detects a peer that died without sending FIN/RST at all (a SIGKILL,
      # not a clean shutdown) faster than the OS default (~2 hours).
      idle_session_timeout: "300000"
      idle_in_transaction_session_timeout: "60000"
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
    pg_hba:
      - hostnossl all all all reject

  storage:
    storageClass: local-path
    size: 20Gi
    resizeInUseVolumes: true

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # Required anti-affinity needs one schedulable node per instance. The
    # k3s-node-labeling role taints the low-memory worker with
    # memory=limited:NoSchedule, which would otherwise leave only two eligible
    # nodes for three instances and hang the third replica in Pending forever.
    tolerations:
      - key: memory
        operator: Equal
        value: limited
        effect: NoSchedule

  monitoring:
    enablePodMonitor: true

  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: freecloud-platform
      app.kubernetes.io/component: database
