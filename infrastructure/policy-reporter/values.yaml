ui:
  enabled: true
  service:
    type: LoadBalancer
    port: 8082
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 100Mi
    limits:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 500Mi

metrics:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
    ephemeral-storage: 100Mi
  limits:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 500Mi

global:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
