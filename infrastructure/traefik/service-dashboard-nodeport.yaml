apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard-nodeport
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: dashboard
      port: 9000
      targetPort: 9000
      nodePort: 30900
