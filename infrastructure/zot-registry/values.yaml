replicaCount: 1

image:
  repository: ghcr.io/project-zot/zot
  tag: v2.1.18@sha256:6f7bf2b8e43437c7c3a121bc80214845c85f27321e66f2ff4be6bf4220775fd7
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

serviceAccount:
  create: false
  name: zot-registry

ingress:
  enabled: true
  className: traefik
  pathtype: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
  hosts:
    - host: registry.freecloudinitiative.com
      paths:
        - path: /
  tls:
    - secretName: zot-registry-public-tls
      hosts:
        - registry.freecloudinitiative.com

mountConfig: true
configFiles:
  config.json: |-
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "gc": true,
        "gcDelay": "24h",
        "storageDriver": {
          "name": "s3",
          "rootdirectory": "/zot",
          "region": "fci-local",
          "regionendpoint": "garage.garage.svc.cluster.local:3900",
          "bucket": "zot-registry",
          "forcepathstyle": true,
          "secure": false,
          "skipverify": false
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.freecloudinitiative.com",
        "readTimeout": "15m",
        "writeTimeout": "15m",
        "auth": {
          "openid": {
            "providers": {
              "authentik": {
                "issuer": "https://auth.freecloudinitiative.com/application/o/zot-registry/",
                "clientid": "zot-oidc",
                "clientsecret": "zot-oidc-secret-123",
                "scopes": ["openid", "profile", "email"]
              }
            }
          }
        }
      },
      "log": {
        "level": "info"
      },
      "extensions": {
        "ui": {
          "enable": true
        },
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      }
    }

env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: zot-s3-credentials
        key: access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: zot-s3-credentials
        key: secret-access-key

persistence: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 2Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    scheme: http

tolerations:
  - key: memory
    operator: Equal
    value: limited
    effect: NoSchedule
